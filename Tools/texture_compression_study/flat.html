<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ridge · Texture detail</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#233e35;font:15px system-ui}header{padding:20px 28px;border-bottom:1px solid #ced4cb}h1{margin:0 0 8px;font-size:26px;font-weight:550}p{margin:6px 0;color:#59655d}a{color:inherit}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:15px 28px}select,button{font:inherit;padding:8px;background:white;border:1px solid #bec9bd;border-radius:5px}canvas{display:block;width:100%;height:65vh;touch-action:none;background:#e4e7df}#status{padding:10px 28px}label{display:flex;gap:8px;align-items:center}footer{padding:14px 28px;font-size:12px}
</style><header><h1>Texture detail</h1><p>Original on the left. Candidate on the right. Drag to inspect the same position in both.</p><p><a href="index.html">3D comparison</a> · <a href="REPORT.md">Measurements</a></p></header>
<nav><select id="variant" aria-label="Candidate"></select><label>Zoom <select id="zoom"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><label><input type="checkbox" id="error">Difference ×8</label><button id="reset">Centre</button></nav>
<div id="status">Loading…</div><canvas id="canvas"></canvas><footer>Decoded candidate pixels · fixed dimensions · browser preview, not app performance. © OpenStreetMap contributors · Welsh Government OGL v3</footer>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let ref,candidate,err,catalog,cx=512,cy=1050,drag,token=0;
async function img(url){let im=new Image();im.src=url;await im.decode();return im}
function draw(){if(!candidate)return;let dpr=Math.min(devicePixelRatio,2),w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.fillStyle='#e4e7df';ctx.fillRect(0,0,w,h);let s=Number($('zoom').value);ctx.imageSmoothingEnabled=false;for(let i=0;i<2;i++){ctx.save();ctx.beginPath();ctx.rect(i*w/2,0,w/2,h);ctx.clip();ctx.drawImage(i?($('error').checked?err:candidate):ref,i*w/2+w/4-cx*s,h/2-cy*s,ref.width*s,ref.height*s);ctx.restore()}ctx.fillStyle='#203d32';ctx.fillRect(w/2,0,1,h)}
async function change(){let id=++token,key=$('variant').value;let images=await Promise.all([img('view-'+key+'.png'),img('error-'+key+'.png')]);if(id!==token)return;[candidate,err]=images;let p=catalog.profiles.find(x=>x.id===key);$('status').textContent=`${p.note}. ${(p.bytes/1000).toFixed(0)} KB for the two encoded tiles. ${p.saving.toFixed(1)}% saving across the study sample.`;draw()}
$('variant').onchange=()=>change().catch(fail);$('zoom').onchange=draw;$('error').onchange=draw;$('reset').onclick=()=>{cx=512;cy=1050;draw()};onresize=draw;
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;let s=Number($('zoom').value);cx=Math.max(0,Math.min(1024,cx-(e.clientX-drag[0])/s));cy=Math.max(0,Math.min(2048,cy-(e.clientY-drag[1])/s));drag=[e.clientX,e.clientY];draw()};
function fail(e){$('status').textContent='Could not load comparison: '+e.message}
(async()=>{catalog=await (await fetch('viewer.json')).json();ref=await img('view-original.png');for(let p of catalog.profiles){let o=document.createElement('option');o.value=p.id;o.textContent=p.label;$('variant').append(o)}$('variant').value='webp-lossless';await change()})().catch(fail);
</script></html>
