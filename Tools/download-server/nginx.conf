worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8787;
        root /data;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        location = /health { access_log off; return 200 "Ridge downloads ready\n"; }
        location = / { default_type text/plain; return 200 "Ridge offline downloads\nConnect this address in Ridge Settings > Download server.\nPrepared areas become available after their catalogue is published.\n"; }
        location = /adaptive-catalog.json {
            limit_except GET { deny all; }
            add_header Cache-Control "no-cache";
        }
        location = /catalog.json {
            limit_except GET { deny all; }
            add_header Cache-Control "no-cache";
        }
        # Serve only published app assets. Build reports, source paths, locks
        # and intermediate metadata are never exposed by the local server.
        location ~ "^/[a-zA-Z0-9_-]+/(pack\.json|overview\.png|cell-[0-9]+-[0-9]+-(1|2|4|8|16|32)m\.bin|map-[0-9]+-[0-9]+-(image|preview)\.png|graph-[0-9]+-[0-9]+\.json)$" {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        # Adaptive geometry is a separate catalogue with an explicit reader
        # capability. The regular-grid app catalogue remains unchanged.
        location ~ "^/[a-zA-Z0-9_-]+/(adaptive\\.json|mesh-[a-zA-Z0-9_-]+\\.(rmesh|rat)\\.zlib|boundary\\.geojson|coverage-gaps\\.geojson)$" {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location = /uk-adaptive-0p5-v2/catalog.json {
            limit_except GET { deny all; }
            add_header Cache-Control "no-cache";
        }
        location ~ "^/uk-adaptive-0p5-v2/z10-x[0-9]+-y[0-9]+-adaptive-0p5/(adaptive\\.json|terrain\\.ratpack|boundary\\.geojson|coverage-gaps\\.geojson)$" {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ "^/uk-coarse-background-v2/(background\\.json|z10-x[0-9]+-y[0-9]+\\.height\\.zlib)$" {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
